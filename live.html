<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Leaderboard · Vinksters Golf 2026</title>
  <style>
    :root {
      --g900: #071a0c;
      --g800: #0d3318;
      --g700: #1a5c2e;
      --g600: #2d7a42;
      --gold: #c9a227;
      --bg:   #f3f7f0;
      --surface: #ffffff;
      --border: #d8e8cf;
      --text: #111a0e;
      --text-dim: #3d5230;
      --text-muted: #7a9465;
      --green: #27ae60;
      --red:   #c0392b;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(8,30,12,.09);
      --font: 'Calibri','Segoe UI',system-ui,sans-serif;
      --max: 620px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; }

    /* Header */
    .header { background: linear-gradient(160deg,var(--g900) 0%,#0a2e12 100%); padding: 18px 16px 14px; border-bottom: 3px solid var(--gold); }
    .header-inner { max-width: var(--max); margin: 0 auto; }
    .header h1 { font-size: 20px; font-weight: 900; color: #fff; line-height: 1.2; }
    .header h1 span { color: var(--gold); }
    .header-sub { font-size: 12px; color: #6a9a72; margin-top: 3px; }

    /* Refresh bar */
    .refresh-bar { background: var(--g800); border-bottom: 1px solid var(--g700); padding: 7px 16px; }
    .refresh-inner { max-width: var(--max); margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    #last-updated { font-size: 11px; color: #5a8a6a; }
    .refresh-btn { background: none; border: 1px solid var(--g600); color: #6a9a72; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 5px; cursor: pointer; }
    .refresh-btn:hover { background: rgba(255,255,255,.06); }
    .refresh-btn:disabled { opacity: .6; cursor: default; }

    /* Main */
    .main { max-width: var(--max); margin: 10px auto 40px; padding: 0 10px; }

    /* Loading / error states */
    #loading-state { text-align: center; padding: 50px 16px; }
    .empty-icon  { font-size: 36px; margin-bottom: 8px; }
    .empty-title { font-size: 15px; font-weight: 700; color: var(--text-dim); margin-bottom: 4px; }
    .empty-sub   { font-size: 12px; color: var(--text-muted); }
    #error-state { display: none; max-width: var(--max); margin: 12px auto; padding: 10px 16px; font-size: 12px; color: #c08020; background: rgba(201,130,0,.07); border-left: 3px solid #c08020; border-radius: 4px; }

    /* Table */
    #table-wrap { display: none; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 9px 10px; font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #6aaa7a; background: var(--g900); text-align: left; white-space: nowrap; }
    thead th.r { text-align: right; }
    thead th:first-child { padding-left: 14px; }
    thead th:last-child  { padding-right: 14px; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child  { border-bottom: none; }
    tbody tr:hover { background: rgba(45,122,66,.04) !important; }
    td { padding: 9px 10px; font-size: 13px; vertical-align: middle; }
    td:first-child { padding-left: 14px; }
    td:last-child  { padding-right: 14px; }
    td.r { text-align: right; }

    /* Cutline */
    tr.cutoff-row td { padding: 5px 14px; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #3a5a7a; background: rgba(90,130,180,.08); border-top: 2px solid #90a8c0; border-bottom: 2px solid #90a8c0; }

    /* Cells */
    .mv { display: inline-block; font-size: 10px; font-weight: 800; min-width: 28px; text-align: center; }
    .mv-up   { color: var(--green); }
    .mv-dn   { color: var(--red); }
    .mv-same { color: #ccc; }
    .rank      { font-size: 14px; font-weight: 900; color: var(--text-dim); }
    .rank.gold { color: var(--gold); }
    .pname     { font-size: 13px; font-weight: 700; }
    .dk-score  { font-size: 13px; font-weight: 800; color: var(--g700); }
    .season-pts{ font-size: 12px; color: var(--text-dim); }
    .proj-pts  { font-size: 12px; font-weight: 700; color: var(--green); }
    .total-pts { font-size: 13px; font-weight: 900; }

    /* Footer */
    footer { background: var(--g900); border-top: 2px solid var(--gold); padding: 12px 16px; text-align: center; }
    footer p { font-size: 11px; color: #3d5a3a; }
    footer span { color: var(--gold); }

    /* Mobile: hide DK Score column, show everything else */
    @media (max-width: 520px) {
      thead th:nth-child(4), tbody td:nth-child(4) { display: none; }
      td, thead th { padding: 7px 6px; font-size: 11px; }
      td:first-child, thead th:first-child { padding-left: 10px; }
      td:last-child,  thead th:last-child  { padding-right: 10px; }
      .rank  { font-size: 12px; }
      .pname { font-size: 12px; }
      .dk-score, .total-pts { font-size: 12px; }
      .season-pts, .proj-pts { font-size: 11px; }
      .mv { font-size: 9px; min-width: 22px; }
      thead th { font-size: 8px; letter-spacing: .06em; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>⛳ FedEx St. Jude <span>Live Standings</span></h1>
    <div class="header-sub">Thru Round 3</div>
  </div>
</div>

<div class="refresh-bar">
  <div class="refresh-inner">
    <span id="last-updated"></span>
    <button id="refresh-btn" class="refresh-btn" onclick="manualRefresh()">↻ Refresh</button>
  </div>
</div>

<div id="error-state"></div>

<div class="main">
  <div id="loading-state">
    <div class="empty-icon">⛳</div>
    <div class="empty-title">Loading leaderboard…</div>
    <div class="empty-sub">Fetching live data from Google Sheets</div>
  </div>

  <div id="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:40px">#</th>
          <th style="width:44px">+/−</th>
          <th>Player</th>
          <th class="r">DK Score</th>
          <th class="r">Season Pts</th>
          <th class="r">+ This Week</th>
          <th class="r">Total</th>
        </tr>
      </thead>
      <tbody id="standings-body"></tbody>
    </table>
  </div>
</div>

<footer>
  <p>© 2026 <span>Vinksters Golf League</span> · Auto-refreshes every 60s</p>
</footer>

<script>
// ── Config ────────────────────────────────────────────────────────────
const SHEET_ID  = '1IQlmVubEOBhZU3-iQDSi8i_75TBgYKApLpKDn6HHqOw';
const OUT_URL   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Output`;
const EXEC_URL  = 'https://script.google.com/macros/s/AKfycbxWd5_dFgW6qNDYGI4lcbAnIe0EhCaru9vh9xxkJT0YcfoDK4VWh7g7YiMJtLIqdu6d3A/exec';

function manualRefresh() { fetchLeaderboard(); }

// ── CSV parser ────────────────────────────────────────────────────────
function parseCSVLine(line) {
  const cols = []; let cur = '', inQ = false;
  for (const ch of line) {
    if (ch === '"') inQ = !inQ;
    else if (ch === ',' && !inQ) { cols.push(cur.replace(/^"|"$/g, '')); cur = ''; }
    else cur += ch;
  }
  cols.push(cur.replace(/^"|"$/g, ''));
  return cols;
}

function parseCSV(text) {
  return text.replace(/\r/g, '').split('\n')
    .filter(l => l.trim())
    .map(parseCSVLine);
}

// ── Fetch & render ────────────────────────────────────────────────────
async function fetchLeaderboard() {
  document.getElementById('last-updated').textContent = 'Refreshing…';
  try {
    const res = await fetch(OUT_URL + '&_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);

    if (rows.length < 2) {
      showError('No data yet — commissioner needs to paste the DK CSV into the DK_Upload tab and click ⛳ Golf League → Update Leaderboard.');
      return;
    }

    // Column index map from header row
    const hdr = rows[0].map(h => h.toLowerCase().trim());
    const ci  = name => hdr.indexOf(name);

    // Metadata: col J (index 9) of header row = update timestamp string
    //           col J (index 9) of first data row = round label
    const updatedStr = rows[0][9] || '';
    const roundLabel = (rows[1] && rows[1][9]) ? rows[1][9] : 'Thru Round 3';

    document.getElementById('last-updated').textContent = updatedStr;
    document.querySelector('.header-sub').textContent   = roundLabel;

    // Parse data rows
    const data = rows.slice(1).map(r => ({
      rank:      parseInt(r[ci('rank')])      || 0,
      player:    r[ci('player')]              || '',
      dkScore:   parseFloat(r[ci('dkscore')]) || 0,
      seasonPts: parseFloat(r[ci('seasonpts')]) || 0,
      fedexDist: parseFloat(r[ci('fedexdist')]) || 0,
      total:     parseFloat(r[ci('total')])   || 0,
      movement:  parseInt(r[ci('movement')])  || 0,
      inContest: r[ci('incontest')] === '1',
    })).filter(e => e.player);

    renderTable(data);
    document.getElementById('error-state').style.display = 'none';

  } catch (e) {
    showError('Could not load data. Make sure the Google Sheet is shared publicly (File → Share → Anyone with the link → Viewer).');
    document.getElementById('last-updated').textContent = 'Error loading';
  }
}

// ── Render table ──────────────────────────────────────────────────────
function renderTable(data) {
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('table-wrap').style.display    = 'block';

  const tbody = document.getElementById('standings-body');
  tbody.innerHTML = '';

  data.forEach((e, idx) => {
    // Cutline before rank 21
    if (e.rank === 21) {
      const cut = document.createElement('tr');
      cut.className = 'cutoff-row';
      cut.innerHTML = '<td colspan="7">── TOP 20 ADVANCE TO BMW CHAMPIONSHIP ──</td>';
      tbody.appendChild(cut);
    }

    const tr = document.createElement('tr');
    tr.style.background = idx % 2 === 0 ? '#fff' : '#fafcf9';

    // Movement arrow
    let mv = '<span class="mv mv-same">—</span>';
    if (e.movement > 0)      mv = `<span class="mv mv-up">▲${e.movement}</span>`;
    else if (e.movement < 0) mv = `<span class="mv mv-dn">▼${Math.abs(e.movement)}</span>`;

    const rankCls = e.rank === 1 ? 'rank gold' : 'rank';
    const dkHtml  = e.inContest
      ? `<span class="dk-score">${e.dkScore.toFixed(2)}</span>`
      : `<span style="color:#aaa;font-size:11px">NO ENTRY</span>`;
    const fdHtml  = e.fedexDist > 0
      ? `<span class="proj-pts">+${e.fedexDist.toFixed(1)}</span>`
      : (e.inContest ? '0' : '—');

    tr.innerHTML = `
      <td><span class="${rankCls}">${e.rank}</span></td>
      <td>${mv}</td>
      <td class="pname">${e.player}</td>
      <td class="r">${dkHtml}</td>
      <td class="r season-pts">${e.seasonPts.toFixed(1)}</td>
      <td class="r">${fdHtml}</td>
      <td class="r total-pts">${e.total.toFixed(1)}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ── Error state ───────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('table-wrap').style.display    = 'none';
  const el = document.getElementById('error-state');
  el.style.display = 'block';
  el.textContent   = '⚠ ' + msg;
}

// ── Init: load now, then auto-refresh every 60s ───────────────────────
fetchLeaderboard();
setInterval(fetchLeaderboard, 60000);
</script>
</body>
</html>
